openapi: 3.0.0
info:
  title: Ecommerce API
  description: API for managing products in an ecommerce CMS.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local Development Server

components:
  schemas:
    Product:
      type: object
      required:
        - name
        - category
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "product name"
        category:
          type: string
          example: "product example"
        price:
          type: number
          example: 99.99
        description:
          type: string
          example: "product description"
        imageUrl:
          type: string
          example: "https://example.com/image_name.jpg"

paths:
  /api/products:
    get:
      summary: Get all products
      description: Retrieve a list of products with optional search and category filtering.
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category name
        - in: query
          name: search
          schema:
            type: string
          description: Search by product name
      responses:
        200:
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        201:
          description: Product created successfully

  /api/products/{id}:
    get:
      summary: Get a single product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Product details
        404:
          description: Product not found
    put:
      summary: Update a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        200:
          description: Product updated
    delete:
      summary: Delete a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Product deleted